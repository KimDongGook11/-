<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720">
  <!-- 필재 캐리커처: 큰 얼굴, 넓은 이마, 큰 뿔테 안경, 한쪽 눈썹 올린 '설명하는' 표정, 손가락 하나 -->
  <g stroke="#1b1b20" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M140 720 C150 605 215 570 300 566 C385 570 450 605 460 720 Z" fill="#26355a"/>
    <path d="M262 570 L300 650 L338 570 Z" fill="#f3f5f8"/>
    <path d="M290 590 L310 590 L316 612 L306 700 L294 700 L284 612 Z" fill="#3f8cff"/>
    <!-- pointing hand -->
    <path d="M430 720 L440 640 C440 625 455 620 462 632 L470 560 C472 545 492 545 494 560 L492 640 C505 640 512 655 505 668 L500 720 Z" fill="#f0c39c"/>
    <!-- neck -->
    <path d="M268 515 L332 515 L336 575 C318 588 282 588 264 575 Z" fill="#e7b48c"/>
    <!-- ears -->
    <ellipse cx="128" cy="330" rx="24" ry="36" fill="#f0c39c"/>
    <ellipse cx="472" cy="330" rx="24" ry="36" fill="#f0c39c"/>
    <!-- big head, wide forehead -->
    <path d="M135 300 C130 150 210 95 300 95 C390 95 470 150 465 300 C462 420 395 525 300 525 C205 525 138 420 135 300 Z" fill="#f6cfaa"/>
    <!-- short hair with side part -->
    <path d="M130 270 C115 120 210 60 305 62 C400 64 480 120 470 268 C455 205 440 175 410 160 C350 175 250 168 200 145 C165 175 140 215 130 270 Z" fill="#1f1f24"/>
    <path d="M200 145 C230 120 270 110 300 112" stroke="#55555f" stroke-width="5" fill="none"/>
  </g>
  <!-- brows: one raised -->
  <path d="M190 245 Q228 222 268 238" stroke="#1b1b20" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M332 248 Q370 244 410 256" stroke="#1b1b20" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- big glasses -->
  <rect x="178" y="265" width="112" height="86" rx="22" fill="#ffffff" fill-opacity="0.18" stroke="#1b1b20" stroke-width="10"/>
  <rect x="310" y="265" width="112" height="86" rx="22" fill="#ffffff" fill-opacity="0.18" stroke="#1b1b20" stroke-width="10"/>
  <path d="M290 300 L310 300" stroke="#1b1b20" stroke-width="9"/>
  <path d="M178 292 L140 285 M422 292 L460 285" stroke="#1b1b20" stroke-width="7"/>
  <circle cx="236" cy="310" r="14" fill="#1b1b20"/><circle cx="366" cy="312" r="14" fill="#1b1b20"/>
  <circle cx="241" cy="305" r="5" fill="#fff"/><circle cx="371" cy="307" r="5" fill="#fff"/>
  <!-- nose -->
  <path d="M300 345 Q282 395 312 398" stroke="#c98d64" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- confident half smile -->
  <path d="M245 440 Q305 478 362 432" stroke="#8f3a33" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M362 432 L372 424" stroke="#8f3a33" stroke-width="7" stroke-linecap="round"/>
</svg>

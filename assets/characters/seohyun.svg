  <ellipse cx="190" cy="310" rx="16" ry="26" fill="#f2c9a8"/>
  <ellipse cx="410" cy="310" rx="16" ry="26" fill="#f2c9a8"/>
  <circle cx="190" cy="345" r="7" fill="#ffd400"/><circle cx="410" cy="345" r="7" fill="#ffd400"/>
  <!-- front hair / bangs -->
  <path d="M185 270 C185 175 245 150 300 150 C365 150 420 180 418 270 C395 215 350 195 318 192 C300 225 245 250 185 270 Z" fill="url(#hair)"/>
  <path d="M185 265 C170 330 175 400 150 440 L200 440 C190 390 195 330 200 285 Z" fill="url(#hair)"/>
  <path d="M415 265 C430 330 425 400 452 440 L402 440 C410 390 405 330 400 285 Z" fill="url(#hair)"/>
  <!-- brows -->
  <path d="M232 262 Q258 250 282 260" stroke="#3a2a24" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M318 260 Q342 250 368 262" stroke="#3a2a24" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="258" cy="300" rx="15" ry="17" fill="#2a1d18"/><circle cx="263" cy="294" r="5" fill="#fff"/>
  <ellipse cx="342" cy="300" rx="15" ry="17" fill="#2a1d18"/><circle cx="347" cy="294" r="5" fill="#fff"/>
  <path d="M238 290 Q258 276 278 290" stroke="#2a1d18" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M322 290 Q342 276 362 290" stroke="#2a1d18" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- nose, cheeks, mouth -->
  <path d="M300 318 Q294 345 304 350" stroke="#d9a685" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="232" cy="345" rx="22" ry="12" fill="#f5a9a0" opacity="0.55"/>
  <ellipse cx="368" cy="345" rx="22" ry="12" fill="#f5a9a0" opacity="0.55"/>
  <path d="M268 378 Q300 405 332 378 Q300 392 268 378 Z" fill="#d9534f"/>
</svg>

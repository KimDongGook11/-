    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a24"/><stop offset="1" stop-color="#1f1512"/></linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4efe6"/><stop offset="1" stop-color="#d9d1c3"/></linearGradient>
  </defs>
  <!-- back hair -->
  <path d="M150 250 C140 120 230 70 300 70 C380 70 465 120 452 260 C450 330 470 400 455 440 Q300 470 145 440 C130 400 150 330 150 250 Z" fill="url(#hair)"/>
  <!-- body / jacket -->
  <path d="M70 720 C80 590 160 540 230 520 L370 520 C440 540 520 590 530 720 Z" fill="url(#jacket)"/>
  <!-- inner top -->
  <path d="M245 522 L300 640 L355 522 Z" fill="#1d2a44"/>
  <!-- lapels -->
  <path d="M230 520 L300 650 L262 720 L205 720 L215 600 Z" fill="#e8e0d2"/>
  <path d="M370 520 L300 650 L338 720 L395 720 L385 600 Z" fill="#e8e0d2"/>
  <circle cx="410" cy="600" r="11" fill="#ffd400"/>

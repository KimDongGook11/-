  <path d="M265 430 L335 430 L340 530 C320 548 280 548 260 530 Z" fill="#f2c9a8"/>
  <path d="M265 470 C285 490 315 490 335 470 L335 440 L265 440 Z" fill="#e3b493"/>
  <!-- face -->

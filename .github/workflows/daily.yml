name: 매일 릴스 만들기

on:
  schedule:
    - cron: "20 21 * * *"   # 매일 한국시간 06:20 (GitHub 예약은 늦거나 빠질 수 있어 cron-job.org로도 실행)
  workflow_dispatch:
    inputs:
      auto:
        description: "자동 실행(하루 1번만)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: reels-daily
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY }}
      YT_SHORTS_TIME: ${{ vars.YT_SHORTS_TIME }}
      OUTRO_TEXT: ${{ vars.OUTRO_TEXT }}
      BRAND_NAME: ${{ vars.BRAND_NAME }}
      TTS_VOICE: ${{ vars.TTS_VOICE }}
      TTS_RATE: ${{ vars.TTS_RATE }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      TITLE_STYLE: ${{ vars.TITLE_STYLE }}
      IG_AUTO_PUBLISH: ${{ vars.IG_AUTO_PUBLISH }}
      BG_SPEED: ${{ vars.BG_SPEED }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE }}
      TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
      TYPECAST_VOICE: ${{ vars.TYPECAST_VOICE }}
      TYPECAST_MODEL: ${{ vars.TYPECAST_MODEL }}
      TYPECAST_TEMPO: ${{ vars.TYPECAST_TEMPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 프로그램 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          sudo apt-get install -y -qq fonts-pretendard 2>/dev/null || true
          if ! fc-list | grep -qi pretendard; then npm i --no-save --prefix /tmp/pf pretendard@1.3.9 >/dev/null 2>&1 && mkdir -p ~/.fonts && find /tmp/pf/node_modules/pretendard -path '*static*' -name 'Pretendard-*.otf' -exec cp {} ~/.fonts/ \; && fc-cache -f >/dev/null; fi
          fc-list | grep -qi pretendard && echo "글꼴: Pretendard" || echo "글꼴: Noto (Pretendard 설치 실패)"
          pip install -q -r requirements.txt
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
      - name: 릴스 생성 → 텔레그램 전송 → 2시간 버튼 대기
        run: python -m reels.generate --wait 120 ${{ (github.event_name == 'schedule' || inputs.auto == 'true') && '--once-per-day' || '' }}
      - name: 상태 저장
        if: always()
        run: |
          git add state
          git diff --cached --quiet && exit 0
          git commit -q -m "state: daily $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done

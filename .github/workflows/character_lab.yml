name: 이슈 뒷담화 캐릭터 시험 제작 (반실사)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "사람마다 후보 수"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt "rembg[cpu]"
      - name: 캐릭터 후보 만들기
        run: python -m reels.character_lab ${{ inputs.count || '2' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: characters
          path: output/characters
